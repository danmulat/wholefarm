  GLEAM_MAN_001:
    module: gleam_core
    name: volatile_solids
    status: implemented
    origin: gleam_pinned_commit
    units: kg_VS_head_day
  GLEAM_MAN_002:
    module: gleam_core
    name: manure_methane
    status: implemented
